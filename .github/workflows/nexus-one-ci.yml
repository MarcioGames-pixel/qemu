name: Nexus One QEMU - build, smoke test, VNC + Bore

on:
  push:
    branches:
      - fix/nexus-one-kernel-load-address
  pull_request:
    paths:
      - 'hw/arm/**'
      - 'include/hw/arm/**'
      - 'meson.build'
      - 'configure'
      - '.github/workflows/nexus-one-ci.yml'
  workflow_dispatch:
    inputs:
      tunnel_minutes:
        description: 'How long to keep the VNC/Bore session alive (requires VNC_PASSWORD secret)'
        required: true
        type: choice
        default: '20'
        options:
          - '10'
          - '20'
          - '30'
          - '40'

permissions:
  contents: read

jobs:
  build-test-vnc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            libcapstone-dev liburing-dev libaio-dev libusb-1.0-0-dev \
            libnuma-dev libcurl4-gnutls-dev libgnutls28-dev \
            libjpeg-dev libpng-dev netcat-openbsd curl

      - name: Install current Meson and Ninja
        run: python3 -m pip install --user --break-system-packages 'meson>=1.6.0' ninja

      - name: Configure QEMU ARM system emulator
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          meson --version
          ./configure --target-list=arm-softmmu --disable-werror --disable-docs

      - name: Compile qemu-system-arm
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ninja -C build qemu-system-arm

      - name: Verify Nexus One machine registration
        run: |
          ./build/qemu-system-arm --version
          ./build/qemu-system-arm -machine help | tee machine-list.txt
          grep -E '(^|[[:space:]])nexus-one([[:space:]]|$)' machine-list.txt

      - name: Smoke-test machine initialization
        shell: bash
        run: |
          set -euo pipefail
          timeout 8s ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -monitor none -serial none -no-reboot \
            >qemu-smoke.log 2>&1 &
          qpid=$!
          sleep 2
          if ! kill -0 "$qpid" 2>/dev/null; then
            cat qemu-smoke.log
            wait "$qpid" || true
            exit 1
          fi
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          if grep -Ei 'error:|failed to initialize|cannot.*machine' qemu-smoke.log; then
            cat qemu-smoke.log
            exit 1
          fi
          echo 'Machine created and stayed running during smoke test.'

      - name: Start local VNC and verify TCP port
        if: ${{ github.event_name != 'workflow_dispatch' || secrets.VNC_PASSWORD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -monitor none -serial none \
            -vnc 127.0.0.1:1 -no-reboot >qemu-vnc.log 2>&1 &
          echo $! > qemu-vnc.pid
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5901; then
              echo 'VNC server is listening on 127.0.0.1:5901.'
              exit 0
            fi
            sleep 1
          done
          cat qemu-vnc.log
          exit 1

      - name: Start password-protected VNC for Bore
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.VNC_PASSWORD != '' }}
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#VNC_PASSWORD}" -lt 8 ] || [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo 'VNC_PASSWORD must be exactly 8 characters (QEMU VNC password limit).'
            exit 1
          fi
          echo "::add-mask::$VNC_PASSWORD"
          ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -serial none \
            -monitor unix:/tmp/nexus-vnc-monitor.sock,server=on,wait=off \
            -vnc 127.0.0.1:1,password=on -no-reboot >qemu-vnc.log 2>&1 &
          echo $! > qemu-vnc.pid
          python3 - <<'PY'
          import os, socket, time
          path = "/tmp/nexus-vnc-monitor.sock"
          for _ in range(30):
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.connect(path)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("QEMU monitor socket did not appear")
          s.settimeout(2)
          try:
              s.recv(4096)
          except OSError:
              pass
          s.sendall(("change vnc password " + os.environ["VNC_PASSWORD"] + "\n").encode())
          time.sleep(1)
          s.close()
          PY
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5901; then
              echo 'Password-protected VNC is listening on 127.0.0.1:5901.'
              exit 0
            fi
            sleep 1
          done
          cat qemu-vnc.log
          exit 1

      - name: Open temporary Bore tunnel to VNC
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.VNC_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            echo 'Rust/Cargo is not available on this runner.'
            exit 1
          fi
          cargo install bore-cli --locked
          echo 'Starting temporary public TCP tunnel to the password-protected VNC port.'
          timeout 40m "$HOME/.cargo/bin/bore" local 5901 --to bore.pub 2>&1 | tee bore.log &
          echo $! > bore.pid
          for i in $(seq 1 20); do
            if grep -E 'bore\.pub:[0-9]+' bore.log; then
              break
            fi
            sleep 1
          done
          if ! grep -E 'bore\.pub:[0-9]+' bore.log; then
            cat bore.log
            exit 1
          fi
          echo 'The tunnel is temporary and will close when this workflow ends.'

      - name: Keep VNC/Bore session alive
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.VNC_PASSWORD != '' }}
        env:
          TUNNEL_MINUTES: ${{ inputs.tunnel_minutes || '20' }}
        run: |
          echo "VNC/Bore session will stay up for $TUNNEL_MINUTES minutes."
          echo "Use the bore.pub:PORT shown in the preceding step and the VNC_PASSWORD repository secret."
          sleep "$((TUNNEL_MINUTES * 60))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-one-qemu-ci-logs
          path: |
            machine-list.txt
            qemu-smoke.log
            qemu-vnc.log
            bore.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop emulator
        if: always()
        run: |
          if [ -f qemu-vnc.pid ]; then kill "$(cat qemu-vnc.pid)" 2>/dev/null || true; fi
          if [ -f bore.pid ]; then kill "$(cat bore.pid)" 2>/dev/null || true; fi
