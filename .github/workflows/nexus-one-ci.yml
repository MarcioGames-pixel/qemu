name: Nexus One QEMU - build, smoke test, VNC + Bore

on:
  push:
    branches:
      - fix/nexus-one-kernel-load-address
  pull_request:
    paths:
      - 'hw/arm/**'
      - 'include/hw/arm/**'
      - 'meson.build'
      - 'configure'
      - '.github/workflows/nexus-one-ci.yml'
  workflow_dispatch:
    inputs:
      tunnel_minutes:
        description: 'How long to keep the VNC/Bore session alive (requires VNC_PASSWORD secret)'
        required: true
        type: choice
        default: '20'
        options:
          - '10'
          - '20'
          - '30'
          - '40'

permissions:
  contents: read

jobs:
  build-test-vnc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git gdb python3 python3-pip pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev \
            libcapstone-dev liburing-dev libaio-dev libusb-1.0-0-dev \
            libnuma-dev libcurl4-gnutls-dev libgnutls28-dev \
            libjpeg-dev libpng-dev netcat-openbsd curl

      - name: Install current Meson and Ninja
        run: python3 -m pip install --user --break-system-packages 'meson>=1.6.0' ninja

      - name: Configure QEMU ARM system emulator
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          meson --version
          ./configure --target-list=arm-softmmu --disable-werror --disable-docs

      - name: Compile qemu-system-arm
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ninja -C build qemu-system-arm

      - name: Verify Nexus One machine registration
        run: |
          ./build/qemu-system-arm --version
          ./build/qemu-system-arm -machine help | tee machine-list.txt
          grep -E '(^|[[:space:]])nexus-one([[:space:]]|$)' machine-list.txt

      - name: Smoke-test machine initialization
        shell: bash
        run: |
          set -euo pipefail
          ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -monitor none -serial none -no-reboot \
            >qemu-smoke.log 2>&1 &
          qpid=$!
          sleep 2
          sleep 1
          qstate="$(ps -o stat= -p "$qpid" 2>/dev/null | tr -d ' ')"
          if [ -z "$qstate" ] || [[ "$qstate" == Z* ]]; then
            echo 'QEMU exited during smoke test.'
            cat qemu-smoke.log
            wait "$qpid" || true
            exit 1
          fi
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          if grep -Ei 'error:|failed to initialize|cannot.*machine' qemu-smoke.log; then
            cat qemu-smoke.log
            exit 1
          fi
          echo 'Machine created and stayed running during smoke test.'

      - name: Start local VNC and verify TCP port
        if: ${{ github.event_name != 'workflow_dispatch' || env.VNC_PASSWORD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -monitor none -serial none \
            -vnc 127.0.0.1:1 -no-reboot >qemu-vnc.log 2>&1 &
          qpid=$!
          echo "$qpid" > qemu-vnc.pid
          trap 'kill "$qpid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5901; then
              echo 'VNC server is listening on 127.0.0.1:5901.'
              exit 0
            fi
            if ! kill -0 "$qpid" 2>/dev/null; then
              echo 'QEMU exited before VNC became available; capturing its crash backtrace.'
              cat qemu-vnc.log || true
              gdb -batch \
                -ex run \
                -ex 'thread apply all bt full' \
                --args ./build/qemu-system-arm \
                  -machine nexus-one -m 256M -S \
                  -display none -monitor none -serial none \
                  -vnc 127.0.0.1:1 -no-reboot \
                >qemu-vnc-backtrace.log 2>&1 || true
              cat qemu-vnc-backtrace.log
              exit 1
            fi
            sleep 1
          done
          cat qemu-vnc.log
          exit 1

      - name: Start password-protected VNC and Bore tunnel
        if: ${{ github.event_name == 'workflow_dispatch' && env.VNC_PASSWORD != '' }}
        env:
          TUNNEL_MINUTES: ${{ inputs.tunnel_minutes || '20' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo 'VNC_PASSWORD must be exactly 8 characters (QEMU VNC password limit).'
            exit 1
          fi
          echo "::add-mask::$VNC_PASSWORD"
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install bore-cli --locked
          ./build/qemu-system-arm \
            -machine nexus-one -m 256M -S \
            -display none -serial none \
            -monitor unix:/tmp/nexus-vnc-monitor.sock,server=on,wait=off \
            -vnc 127.0.0.1:1,password=on -no-reboot >qemu-vnc.log 2>&1 &
          qpid=$!
          echo "$qpid" > qemu-vnc.pid
          cleanup() {
            kill "$qpid" 2>/dev/null || true
            if [ -n "${bore_pid:-}" ]; then kill "$bore_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import os, socket, time
          path = "/tmp/nexus-vnc-monitor.sock"
          for _ in range(30):
              try:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.connect(path)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("QEMU monitor socket did not appear")
          s.settimeout(2)
          try:
              s.recv(4096)
          except OSError:
              pass
          s.sendall(("change vnc password " + os.environ["VNC_PASSWORD"] + "\n").encode())
          time.sleep(1)
          s.close()
          PY
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 5901; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 5901 || { cat qemu-vnc.log; exit 1; }
          echo 'VNC is listening locally; starting the temporary Bore tunnel.'
          timeout 40m "$HOME/.cargo/bin/bore" local 5901 --to bore.pub >bore.log 2>&1 &
          bore_pid=$!
          echo "$bore_pid" > bore.pid
          for i in $(seq 1 30); do
            if grep -E 'bore\.pub:[0-9]+' bore.log; then break; fi
            if ! kill -0 "$bore_pid" 2>/dev/null; then cat bore.log; exit 1; fi
            sleep 1
          done
          if ! grep -E 'bore\.pub:[0-9]+' bore.log; then
            cat bore.log
            exit 1
          fi
          echo 'Connect a VNC client to the bore.pub:PORT printed above; use the VNC_PASSWORD repository secret.'
          echo "Tunnel will remain active for $TUNNEL_MINUTES minutes."
          sleep "$((TUNNEL_MINUTES * 60))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-one-qemu-ci-logs
          path: |
            machine-list.txt
            qemu-smoke.log
            qemu-vnc.log
            qemu-vnc-backtrace.log
            bore.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop emulator
        if: always()
        run: |
          if [ -f qemu-vnc.pid ]; then kill "$(cat qemu-vnc.pid)" 2>/dev/null || true; fi
          if [ -f bore.pid ]; then kill "$(cat bore.pid)" 2>/dev/null || true; fi
